# the demo back-end total configuration: what the user needs beyond defaults
# port: default (8080) — the vite front sends visits from origin http://localhost:8080
# classpath location = immune to the directory `mvn` runs from (repo root works fine)
# and resolves inside packaged jars too; ../frontend-assets receives the Vite build
inertia.vite-manifest=classpath:META-INF/resources/manifest.json
# dev mode: pair `npm run dev` with `mvn -pl inertia-demo-spring-boot2 spring-boot:run` +
# spring-boot-devtools. Detection is automatic: each front writes the hot flag inside
# its OWN node_modules/.hot-inertia and the starter scans for it (empty default);
# the React Fast Refresh preamble is auto-detected too (no property needed)
