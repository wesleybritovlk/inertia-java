<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inertia-java-bean demo</title>
    <!-- the @vite equivalent: the renderer bean resolves the entry from the Vite manifest -->
    <script type="module" th:src="${viteAppJs}"></script>
    <th:block th:each="css : ${viteCss}">
      <link rel="stylesheet" th:href="${css}" />
    </th:block>
  </head>
  <body>
    <div th:id="${inertiaRootId}"></div>
    <script th:attr="data-page=${inertiaRootId}" type="application/json" th:utext="${inertiaPageJson}"></script>
  </body>
</html>
