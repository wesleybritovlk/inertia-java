# the demo back-end total configuration: what the user needs beyond defaults
server.port=8800
inertia.vite-manifest=src/main/resources/static/manifest.json
# dev mode: pair `npm run dev` with `mvn -pl inertia-demo spring-boot:run` +
# spring-boot-devtools. For the React front also set:
#   inertia.vite-react-refresh=true
#   inertia.vite-entry=src/app.jsx
# (this demo shares ONE .hot-inertia flag across the three front-ends; single-front
# projects keep both defaults: node_modules/.hot-inertia)
inertia.vite-dev-hot=.hot-inertia
