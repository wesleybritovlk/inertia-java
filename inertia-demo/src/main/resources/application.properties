# the demo back-end total configuration: what the user needs beyond defaults
server.port=8800
# classpath location = immune to the directory `mvn` runs from (repo root works fine)
# and resolves inside packaged jars too; the static folder receives the Vite build
inertia.vite-manifest=classpath:static/manifest.json
# dev mode: pair `npm run dev` with `mvn -pl inertia-demo spring-boot:run` +
# spring-boot-devtools. Detection is automatic: each front writes the hot flag inside
# its OWN node_modules/.hot-inertia and the starter scans for it (empty default).
# For the React front also set:
#   inertia.vite-react-refresh=true
#   inertia.vite-entry=src/app.jsx
